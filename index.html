    // ─────────────── 7. Lecteur (YouTube préchargé + fichiers) ───────────────
    let ytApi = null;
    function loadYT() {
      if (window.YT?.Player) return Promise.resolve(window.YT);
      if (ytApi) return ytApi;
      ytApi = new Promise((resolve, reject) => {
        const prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = () => { try { prev?.(); } catch { /* ignore */ } resolve(window.YT); };
        const s = document.createElement('script');
        s.src = 'https://www.youtube.com/iframe_api';
        s.async = true;
        s.onerror = () => { ytApi = null; s.remove(); reject(new Error('youtube-api')); };
        document.head.appendChild(s);
        setTimeout(() => { if (!window.YT?.Player) { ytApi = null; reject(new Error('youtube-timeout')); } }, 15000);
      });
      return ytApi;
    }
    const YT_ERRORS = {
      2: 'Ce lien YouTube est invalide.',
      5: 'Ce navigateur ne peut pas lire cette vidéo.',
      100: 'Vidéo introuvable ou passée en privé.',
      101: 'L’auteur a désactivé la lecture sur d’autres sites.',
      150: 'L’auteur a désactivé la lecture sur d’autres sites.',
      153: 'YouTube refuse la lecture intégrée sur cette page.',
    };
    const P = {
      isOpen: false, cur: null, yt: null, ready: false, warming: null, pending: null,
      played: false, autoMuted: false, timer: 0, lastFocus: null, el: {},

      init() {
        const g = (id) => document.getElementById(id);
        this.el = { root: g('player'), shell: g('pl-shell'), head: g('pl-head'), wrap: g('pl-wrap'), stage: g('pl-stage'), host: g('yt-host'), video: g('pl-video'), poster: g('pl-poster'), amb: g('pl-amb'), err: g('pl-err'), unmute: g('pl-unmute'), title: g('pl-t'), meta: g('pl-m'), op: g('pl-op'), notes: g('pl-notes'), acts: g('pl-acts'), ctrl: g('pl-ctrl') };
        this.el.unmute.innerHTML = `${icon('speaker', 18)} Activer le son`;
        const closeOnEmpty = (e) => { if (e.target === e.currentTarget) closePlayer(); };
        this.el.wrap.addEventListener('click', closeOnEmpty);
        this.el.shell.addEventListener('click', closeOnEmpty);
        let raf = 0;
        window.addEventListener('resize', () => { if (!this.isOpen) return; cancelAnimationFrame(raf); raf = requestAnimationFrame(() => this.size()); }, { passive: true });
        this.syncControls();
      },
      warm() {
        if (this.warming) return this.warming;
        this.warming = loadYT().then((YT) => new Promise((resolve) => {
          const mount = document.createElement('div');
          this.el.host.appendChild(mount);
          this.yt = new YT.Player(mount, {
            host: 'https://www.youtube-nocookie.com',
            width: '100%', height: '100%',
            playerVars: { autoplay: 0, controls: 1, playsinline: 1, rel: 0, iv_load_policy: 3, modestbranding: 1, fs: 1, enablejsapi: 1, origin: location.origin },
            events: {
              onReady: () => {
                this.ready = true;
                resolve(this.yt);
                const p = this.pending;
                this.pending = null;
                if (p && this.cur?.id === p.id) this.load(p);
              },
              onStateChange: (e) => this.onState(e.data),
              onError: (e) => this.onError(e.data),
            },
          });
        }));
        this.warming.catch(() => {
          this.warming = null;
          if (this.cur?.provider === 'youtube' && !this.ready) this.showError('Le lecteur YouTube ne répond pas. Vérifie ta connexion puis réessaie.');
        });
        return this.warming;
      },
      prefetch(s) {
        this.warm();
        if (s.provider !== 'youtube' || !this.ready || this.isOpen) return;
        try { this.yt.cueVideoById({ videoId: s.video_id, startSeconds: s.start_seconds || 0 }); } catch { /* ignore */ }
      },
      open(s) {
        if (this.isOpen && this.cur?.id === s.id) return;
        this.fill(s);
        if (!this.isOpen) {
          this.isOpen = true;
          this.lastFocus = document.activeElement;
          const root = this.el.root;
          root.inert = false; root.removeAttribute('inert');
          root.setAttribute('aria-hidden', 'false');
          root.classList.add('open');
          document.documentElement.classList.add('lock');
          setTimeout(() => this.el.shell.focus({ preventScroll: true }), 60);
        }
        this.load(s);
      },
      close() {
        if (!this.isOpen) return;
        this.isOpen = false;
        clearTimeout(this.timer);
        const root = this.el.root;
        root.classList.remove('open');
        root.inert = true; root.setAttribute('inert', '');
        root.setAttribute('aria-hidden', 'true');
        document.documentElement.classList.remove('lock');
        this.pending = null;
        try { this.yt?.stopVideo?.(); } catch { /* ignore */ }
        const v = this.el.video;
        try { v.pause(); } catch { /* ignore */ }
        if (v.getAttribute('src')) { v.removeAttribute('src'); try { v.load(); } catch { /* ignore */ } }
        this.cur = null;
        this.el.stage.classList.remove('playing', 'err');
        this.lastFocus?.focus?.({ preventScroll: true });
      },
      fill(s) {
        const op = s.operator_id ? S.I.opById.get(s.operator_id) : null;
        const site = S.I.siteById.get(s.site_id);
        const m = site && S.I.mapById.get(site.map_id);
        this.el.root.dataset.side = s.side;
        this.el.title.textContent = s.title;
        this.el.op.innerHTML = opAvatar(op, 44);
        this.el.meta.innerHTML = `<span class="sidepill ${s.side}">${SIDES[s.side].label}</span><span class="ell">${esc(m?.name || '')}, ${esc(site?.name || '')}</span>`;
        this.el.notes.textContent = s.notes || '';
        this.el.acts.innerHTML = S.admin.isAdmin ? `<button class="circle glass-btn" data-act="strat-edit" data-id="${s.id}" aria-label="Modifier la vidéo">${icon('pencil', 19)}</button>` : '';
        if (s.provider === 'youtube') { this.el.amb.src = ytThumb(s.video_id, 'hqdefault'); this.el.amb.classList.add('on'); }
        else { this.el.amb.removeAttribute('src'); this.el.amb.classList.remove('on'); }
      },
      load(s) {
        this.cur = s; this.played = false; this.autoMuted = false;
        clearTimeout(this.timer);
        const { stage, poster, err, unmute, video } = this.el;
        stage.classList.remove('playing', 'err');
        stage.classList.toggle('short', s.kind === 'short');
        stage.classList.toggle('file', s.provider === 'file');
        err.hidden = true; unmute.hidden = true;
        if (s.provider === 'youtube') { poster.src = ytThumb(s.video_id, 'hqdefault'); poster.hidden = false; }
        else { poster.removeAttribute('src'); poster.hidden = true; }
        this.syncControls();
        this.size();
        if (s.provider === 'file') {
          try { this.yt?.stopVideo?.(); } catch { /* ignore */ }
          this.loadFile(s);
          return;
        }
        try { video.pause(); } catch { /* ignore */ }
        if (video.getAttribute('src')) { video.removeAttribute('src'); try { video.load(); } catch { /* ignore */ } }
        if (!this.ready) { this.pending = s; this.warm(); return; }
        const opts = { videoId: s.video_id, startSeconds: s.start_seconds || 0 };
        if (s.end_seconds) opts.endSeconds = s.end_seconds;
        try {
          if (S.prefs.muted) this.yt.mute(); else this.yt.unMute();
          this.yt.loadVideoById(opts);
        } catch { this.showError('Lecture impossible.'); return; }
        this.timer = setTimeout(() => {
          if (this.cur !== s || this.played) return;
          let st = -1;
          try { st = this.yt.getPlayerState(); } catch { /* ignore */ }
          if (st !== 1 && st !== 3) {
            // lecture automatique bloquée (souvent sur iPhone) : on relance en muet
            try { this.yt.mute(); this.yt.playVideo(); } catch { /* ignore */ }
            this.autoMuted = !S.prefs.muted;
            this.syncControls();
          }
        }, 1600);
      },
      loadFile(s) {
        const v = this.el.video;
        const start = s.start_seconds || 0;
        v.muted = S.prefs.muted;
        v.onloadedmetadata = () => {
          if (start && v.currentTime < start - 0.3) { try { v.currentTime = start; } catch { /* ignore */ } }
          v.playbackRate = S.prefs.rate;
          if (v.videoHeight > v.videoWidth && !this.el.stage.classList.contains('short')) { this.el.stage.classList.add('short'); this.size(); }
        };
        v.onplaying = () => { this.played = true; this.el.stage.classList.add('playing'); };
        v.ontimeupdate = () => { if (s.end_seconds && v.currentTime >= s.end_seconds) { if (S.prefs.loop) v.currentTime = start; else v.pause(); } };
        v.onended = () => { if (S.prefs.loop && this.isOpen) { v.currentTime = start; v.play().catch(() => {}); } };
        v.onerror = () => { if (this.cur === s) this.showError('Ce fichier vidéo est illisible ou inaccessible.', true); };
        // le fragment #t= démarre directement au bon moment, sans afficher le début
        v.src = `${s.video_url.split('#')[0]}${start ? `#t=${start}` : ''}`;
        v.play().catch(() => {
          v.muted = true;
          this.autoMuted = !S.prefs.muted;
          this.syncControls();
          v.play().catch(() => {});
        });
      },
      onState(st) {
        const s = this.cur;
        if (!s || s.provider !== 'youtube' || !this.isOpen) return;
        if (st === 1) {
          this.played = true;
          this.el.stage.classList.add('playing');
          try { if (this.yt.getPlaybackRate() !== S.prefs.rate) this.yt.setPlaybackRate(S.prefs.rate); } catch { /* ignore */ }
          if (this.autoMuted) this.el.unmute.hidden = false;
        } else if (st === 0 && S.prefs.loop) {
          try {
            if (s.end_seconds) this.yt.loadVideoById({ videoId: s.video_id, startSeconds: s.start_seconds || 0, endSeconds: s.end_seconds });
            else { this.yt.seekTo(s.start_seconds || 0, true); this.yt.playVideo(); }
          } catch { /* ignore */ }
        }
      },
      onError(code) {
        if (!this.cur || !this.isOpen) return;
        this.showError(YT_ERRORS[code] || 'Lecture impossible.', true);
      },
      showError(msg, withLink = false) {
        const s = this.cur;
        this.el.stage.classList.add('err');
        const url = s?.provider === 'youtube' ? `https://www.youtube.com/watch?v=${s.video_id}${s.start_seconds ? `&t=${s.start_seconds}s` : ''}` : s?.video_url;
        this.el.err.innerHTML = `${icon('warning', 26)}<p>${esc(msg)}</p>${withLink && url ? `<a class="btn btn-glass btn-sm" href="${esc(url)}" target="_blank" rel="noopener">${s?.provider === 'youtube' ? 'Ouvrir sur YouTube' : 'Ouvrir le fichier'}</a>` : ''}`;
        this.el.err.hidden = false;
      },
      size() {
        const { root, shell, head, ctrl, notes, stage } = this.el;
        const cs = getComputedStyle(shell);
        const gap = parseFloat(cs.rowGap) || 12;
        const availW = shell.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
        const notesH = notes.textContent.trim() ? notes.offsetHeight + gap : 0;
        const availH = root.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - head.offsetHeight - ctrl.offsetHeight - notesH - gap * 2;
        const ratio = stage.classList.contains('short') ? 9 / 16 : 16 / 9;
        let w = availW, h = w / ratio;
        if (h > availH) { h = availH; w = h * ratio; }
        w = Math.max(200, Math.floor(w)); h = Math.max(200, Math.floor(h));
        stage.style.width = `${w}px`; stage.style.height = `${h}px`;
      },
      setRate(r) {
        S.prefs.rate = r; savePrefs();
        try {
          if (this.cur?.provider === 'file') this.el.video.playbackRate = r;
          else this.yt?.setPlaybackRate(r);
        } catch { /* ignore */ }
        this.syncControls();
      },
      toggleLoop() {
        S.prefs.loop = !S.prefs.loop; savePrefs();
        this.syncControls();
        toast(S.prefs.loop ? 'Lecture en boucle activée' : 'Lecture en boucle désactivée', 'info', 1600);
      },
      toggleSound() {
        const muted = S.prefs.muted || this.autoMuted;
        if (muted) {
          S.prefs.muted = false; this.autoMuted = false;
          try { this.yt?.unMute(); } catch { /* ignore */ }
          this.el.video.muted = false;
        } else {
          S.prefs.muted = true;
          try { this.yt?.mute(); } catch { /* ignore */ }
          this.el.video.muted = true;
        }
        this.el.unmute.hidden = true;
        savePrefs(); this.syncControls();
      },
      togglePlay() {
        if (!this.cur) return;
        if (this.cur.provider === 'file') { const v = this.el.video; if (v.paused) v.play().catch(() => {}); else v.pause(); return; }
        try { if (this.yt.getPlayerState() === 1) this.yt.pauseVideo(); else this.yt.playVideo(); } catch { /* ignore */ }
      },
      syncControls() {
        $$('#pl-rates button').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.rate) === S.prefs.rate)));
        $('#pl-loop').setAttribute('aria-pressed', String(S.prefs.loop));
        const muted = S.prefs.muted || this.autoMuted;
        const snd = $('#pl-sound');
        snd.innerHTML = icon(muted ? 'speaker-off' : 'speaker', 21);
        snd.setAttribute('aria-label', muted ? 'Activer le son' : 'Couper le son');
        snd.setAttribute('aria-pressed', String(!muted));
      },
    };

    // ─────────────── 8. Feuilles, toasts, formulaires ───────────────
    const Sheet = {
      stack: [],
      get top() { return this.stack[this.stack.length - 1] || null; },
      open({ title, body, onMount }) {
        const layer = document.createElement('div');
        layer.className = 'layer';
        layer.innerHTML = `<div class="scrim" data-act="sheet-close"></div>
          <section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
            <div class="sheet-top"><div class="grab" aria-hidden="true"></div>
              <header class="sheet-h"><h2>${esc(title)}</h2><button class="sheet-x" data-act="sheet-close" aria-label="Fermer">${icon('xmark', 18)}</button></header></div>
            <div class="sheet-b">${body}</div>
          </section>`;
        $('#sheets').appendChild(layer);
        const entry = { layer, paint: null, lastFocus: document.activeElement };
        this.stack.push(entry);
        document.documentElement.classList.add('lock');
        requestAnimationFrame(() => requestAnimationFrame(() => layer.classList.add('open')));
        this.drag(layer, entry);
        onMount?.(layer.querySelector('.sheet-b'), entry);
        return entry;
      },
      close(entry = this.top) {
        if (!entry || !this.stack.includes(entry)) return;
        this.stack = this.stack.filter((e) => e !== entry);
        entry.layer.classList.add('closing');
        entry.layer.classList.remove('open');
        setTimeout(() => entry.layer.remove(), 320);
        if (!this.stack.length && !P.isOpen) document.documentElement.classList.remove('lock');
        if (entry.lastFocus?.isConnected) entry.lastFocus.focus({ preventScroll: true });
      },
      closeAll() { [...this.stack].reverse().forEach((e) => this.close(e)); },
      repaint() { this.stack.forEach((e) => e.paint?.()); },
      drag(layer, entry) {
        const sheet = layer.querySelector('.sheet');
        const handle = layer.querySelector('.sheet-top');
        let y0 = null, dy = 0;
        handle.addEventListener('touchstart', (e) => { y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none'; }, { passive: true });
        handle.addEventListener('touchmove', (e) => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, { passive: true });
        handle.addEventListener('touchend', () => {
          if (y0 == null) return;
          sheet.style.transition = ''; sheet.style.transform = '';
          y0 = null;
          if (dy > 90) this.close(entry);
        });
      },
    };
    function toast(msg, type = 'ok', ms = 2600) {
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.setAttribute('role', type === 'err' ? 'alert' : 'status');
      t.innerHTML = `${icon(type === 'err' ? 'warning' : type === 'info' ? 'refresh' : 'check', 17)}<span>${esc(msg)}</span>`;
      const box = $('#toasts');
      box.appendChild(t);
      while (box.children.length > 3) box.firstElementChild.remove();
      setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 300); }, ms);
    }
    function formErr(f, msg) {
      const p = f.querySelector('[data-err]');
      if (!p) { if (msg) toast(msg, 'err'); return; }
      p.textContent = msg || '';
      p.hidden = !msg;
    }
    function setBusy(f, busy) {
      const b = f.querySelector('[type="submit"]');
      if (b) { b.disabled = busy; b.classList.toggle('busy', busy); }
    }
    function arm(el, label) {
      if (el.dataset.armed === '1') return true;
      const html = el.innerHTML;
      el.dataset.armed = '1';
      el.dataset.html = html;
      el.classList.add('armed');
      el.innerHTML = `${icon('trash', 18)} ${esc(label)}`;
      setTimeout(() => disarm(el), 3500);
      return false;
    }
    function disarm(el) {
      if (!el?.isConnected || el.dataset.armed !== '1') return;
      el.dataset.armed = '';
      el.classList.remove('armed');
      el.innerHTML = el.dataset.html || '';
    }
    function loadError(e) {
      const m = e?.message || '';
      if (e?.name === 'AbortError') return 'Supabase ne répond pas. Le projet est peut-être en pause : ouvre-le sur supabase.com pour le réactiver.';
      if (e?.status === 401 || e?.status === 403 || /api key/i.test(m)) return 'Clé Supabase refusée. Vérifie la clé publishable dans config.js.';
      if (e?.status === 404 || e?.code === 'PGRST205' || /schema cache|does not exist/i.test(m)) return 'Les tables n’existent pas encore. Exécute supabase-setup.sql dans Supabase › SQL Editor.';
      if (/failed to fetch|networkerror|load failed/i.test(m)) return 'Connexion impossible. Vérifie ton réseau ou réactive le projet Supabase s’il est en pause.';
      return m || 'Erreur inconnue.';
    }
    function dbError(e) {
      const msg = e?.message || String(e || '');
      const code = e?.code || '';
      if (/Cet agent ne joue pas/.test(msg)) return msg;
      if (code === '42501' || /row-level security|permission denied/i.test(msg)) return 'Action refusée : ce compte n’a pas les droits de gestion.';
      if (code === '23505' || /duplicate key/i.test(msg)) return 'Cet élément existe déjà.';
      if (code === '23514' || /check constraint/i.test(msg)) return 'Valeur refusée par la base. Vérifie le lien et les temps de début et de fin.';
      if (code === '23503') return 'Élément lié introuvable. Actualise les données.';
      if (/jwt|token|session|not authenticated/i.test(msg)) return 'Session expirée : reconnecte-toi.';
      if (/failed to fetch|networkerror|load failed/i.test(msg)) return 'Réseau indisponible.';
      if (/mime type|exceeded the maximum|payload too large/i.test(msg)) return 'Image refusée : PNG, JPG, WebP, SVG ou GIF de moins de 5 Mo.';
      return msg || 'Erreur inattendue.';
    }

    // ─────────────── 9. Supabase (connexion & écritures) ───────────────
    let sbPromise = null;
    function sb() {
      if (!sbPromise) {
        sbPromise = (async () => {
          let mod = null, lastErr = null;
          for (const url of SB_MODULES) { try { mod = await import(url); break; } catch (e) { lastErr = e; } }
          if (!mod) throw lastErr || new Error('supabase-js');
          return mod.createClient(CFG.url, CFG.key, { auth: { storageKey: KEYS.auth, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
        })();
        sbPromise.catch(() => { sbPromise = null; });
      }
      return sbPromise;
    }
    let authWired = false;
    function wireAuth(client) {
      if (authWired) return;
      authWired = true;
      client.auth.onAuthStateChange((_event, session) => { setTimeout(() => applySession(session), 0); });
    }
    async function initAuth() {
      if (!CFG.ok) return;
      let stored = null;
      try { stored = localStorage.getItem(KEYS.auth); } catch { /* ignore */ }
      if (!stored) return;
      try { wireAuth(await sb()); } catch { /* hors ligne : on réessaiera à la connexion */ }
    }
    async function applySession(session) {
      const user = session?.user || null;
      let isAdmin = false;
      if (user) {
        try { const c = await sb(); const { data, error } = await c.rpc('is_admin'); isAdmin = !error && data === true; } catch { /* ignore */ }
      }
      const changed = (S.admin.user?.id || null) !== (user?.id || null) || S.admin.isAdmin !== isAdmin;
      S.admin = { user, isAdmin };
      document.documentElement.classList.toggle('is-admin', isAdmin);
      if (changed && S.status === 'ready') {
        render();
        if (P.isOpen && P.cur) P.fill(P.cur);
      }
    }
    async function write(fn) {
      try {
        const c = await sb();
        const { data, error } = await fn(c);
        if (error) throw error;
        return data ?? true;
      } catch (e) {
        toast(dbError(e), 'err', 4200);
        return null;
      }
    }
    async function doLogin(f, entry) {
      const email = f.email.value.trim(), password = f.password.value;
      if (!email || !password) return formErr(f, 'Renseigne ton email et ton mot de passe.');
      formErr(f, ''); setBusy(f, true);
      try {
        const c = await sb();
        wireAuth(c);
        const { data, error } = await c.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await applySession(data.session);
        Sheet.close(entry);
        if (S.admin.isAdmin) toast('Mode gestion activé');
        else toast('Connecté, mais ce compte n’a pas les droits de gestion.', 'err', 4200);
      } catch (e) {
        const m = e?.message || '';
        formErr(f, /invalid login|invalid credentials/i.test(m) ? 'Email ou mot de passe incorrect.' : /email not confirmed/i.test(m) ? 'Email non confirmé : coche « Auto Confirm User » en créant le compte dans Supabase.' : dbError(e));
      } finally { setBusy(f, false); }
    }
    async function resizeImage(file, max, type) {
      try {
        const bmp = await createImageBitmap(file);
        const scale = Math.min(1, max / Math.max(bmp.width, bmp.height));
        if (scale === 1 && file.size < 350000) { bmp.close?.(); return null; }
        const w = Math.max(1, Math.round(bmp.width * scale)), h = Math.max(1, Math.round(bmp.height * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(bmp, 0, 0, w, h);
        bmp.close?.();
        return await new Promise((res) => canvas.toBlob((b) => res(b), type, 0.86));
      } catch { return null; }
    }
    async function uploadImage(file, folder, base) {
      const c = await sb();
      let blob = file;
      let type = file.type || 'image/png';
      let ext = (file.name.split('.').pop() || 'png').toLowerCase().replace(/[^a-z0-9]/g, '') || 'png';
      if (type !== 'image/svg+xml' && type !== 'image/gif') {
        const out = await resizeImage(file, folder === 'maps' ? 1280 : 256, folder === 'maps' ? 'image/jpeg' : 'image/png');
        if (out) { blob = out; type = out.type; ext = type === 'image/jpeg' ? 'jpg' : type === 'image/webp' ? 'webp' : 'png'; }
      }
      const path = `${folder}/${slugify(base)}-${Date.now().toString(36)}.${ext}`;
      const { error } = await c.storage.from('media').upload(path, blob, { contentType: type, cacheControl: '31536000', upsert: false });
      if (error) throw error;
      return c.storage.from('media').getPublicUrl(path).data.publicUrl;
    }

    // ─────────────── 10. Gestion (ajout, édition, suppression) ───────────────

          <div class="menu">

    // —— Formulaire vidéo ——
    async function fetchTitle(p) {
      const target = encodeURIComponent(`https://www.youtube.com/watch?v=${p.videoId}`);
      for (const url of [`https://www.youtube.com/oembed?format=json&url=${target}`, `https://noembed.com/embed?url=${target}`]) {
        try {
          const ctrl = new AbortController();
          const t = setTimeout(() => ctrl.abort(), 3500);
          const res = await fetch(url, { signal: ctrl.signal });
          clearTimeout(t);
          if (res.ok) { const j = await res.json(); if (j?.title) return String(j.title); }
        } catch { /* CORS ou réseau : on passe à la suite */ }
      }
      return null;
    }
    function openStratForm(existing = null) {
      if (!S.admin.isAdmin) return openAccount();
      if (!S.data.maps.length) return toast('Ajoute d’abord une carte.', 'err');
      const r = S.route;
      const st = existing
        ? { site_id: existing.site_id, side: existing.side, operator_id: existing.operator_id, category: existing.category, kind: existing.kind, parsed: parseVideoUrl(existing.video_url) }
        : { site_id: r.site || null, side: r.side || 'attack', operator_id: null, category: 'trick', kind: null, parsed: null };
      const site = st.site_id && S.I.siteById.get(st.site_id);
      st.map_id = site ? site.map_id : (curMap()?.id || S.data.maps[0].id);
      const e = existing || {};

    function mountStratForm(body, st, existing, entry) {
      const f = body.querySelector('form');
      const elPreview = body.querySelector('[data-preview]');
      const elSites = body.querySelector('[data-sites]');
      const elPicker = body.querySelector('[data-picker]');
      const elOpQ = body.querySelector('[data-op-q]');
      const elOpName = body.querySelector('[data-op-name]');
      let titleTouched = Boolean(existing);
      let seq = 0;
      f.title.addEventListener('input', () => { titleTouched = f.title.value.trim().length > 0; });

      const fillSites = () => {
        const sites = S.I.sitesByMap.get(f.map_id.value) || [];
        if (!sites.some((s) => s.id === st.site_id)) st.site_id = sites[0]?.id || null;
        elSites.innerHTML = sites.map((s) => `<option value="${s.id}"${s.id === st.site_id ? ' selected' : ''}>${esc(s.floor)} ${esc(s.name)}</option>`).join('') || '<option value="">Aucun BP</option>';
      };
      const paintSides = () => $$('[data-side]', body.querySelector('[data-sides]')).forEach((b) => b.setAttribute('aria-checked', String(b.dataset.side === st.side)));
      const paintPicker = () => {
        const q = compact(elOpQ.value);
        const ops = S.data.operators.filter((o) => o.side === st.side);
        if (st.operator_id && !ops.some((o) => o.id === st.operator_id)) st.operator_id = null;
        elPicker.innerHTML = `<button type="button" class="pk" role="radio" data-op="" aria-checked="${!st.operator_id}">${opAvatar(null, 44)}<span class="nm">Aucun</span></button>${
          ops.filter((o) => !q || compact(o.name).includes(q) || o.id === st.operator_id).map((o) => `<button type="button" class="pk" role="radio" data-op="${o.id}" aria-checked="${o.id === st.operator_id}">${opAvatar(o, 44)}<span class="nm">${esc(o.name)}</span></button>`).join('')}`;
        const sel = st.operator_id && S.I.opById.get(st.operator_id);
        elOpName.textContent = sel ? `(${sel.name})` : '(aucun)';
      };
      const paintCats = () => $$('[data-cat]', body.querySelector('[data-cats]')).forEach((b) => b.setAttribute('aria-checked', String(b.dataset.cat === st.category)));
      const paintPreview = () => {
        const p = st.parsed;
        const raw = f.video_url.value.trim();
        if (!p) {
          elPreview.className = 'preview bad';
          elPreview.innerHTML = raw ? `${icon('warning', 18)}<span>Lien non reconnu. Colle un lien YouTube, un Short ou un fichier .mp4.</span>` : '';
          elPreview.hidden = !raw;
          return;
        }
        const kind = st.kind || p.kind;
        const th = p.provider === 'youtube'
          ? `<span class="pth${kind === 'short' ? ' short' : ''}" style="background-image:url('${ytThumb(p.videoId, 'hqdefault')}')"></span>`
          : `<span class="pth">${icon('film', 22)}</span>`;
        elPreview.className = 'preview';
        elPreview.hidden = false;
        elPreview.innerHTML = `${th}<span class="pinfo"><span class="ptag">${p.provider === 'youtube' ? 'YouTube' : 'Fichier vidéo'}${p.start ? `, départ à ${fmtTime(p.start)}` : ''}</span>
          <span class="segc mini" role="radiogroup" aria-label="Format"><button type="button" role="radio" data-kind="video" aria-checked="${kind === 'video'}">Vidéo 16:9</button><button type="button" role="radio" data-kind="short" aria-checked="${kind === 'short'}">Short 9:16</button></span></span>`;
      };
      const onLink = debounce(() => {
        const p = parseVideoUrl(f.video_url.value);
        const changed = (p?.videoId || p?.url || null) !== (st.parsed?.videoId || st.parsed?.url || null);
        st.parsed = p;
        if (changed) st.kind = null;
        if (p?.start != null && !f.start.value.trim()) f.start.value = fmtTime(p.start);
        if (p?.end != null && !f.end.value.trim()) f.end.value = fmtTime(p.end);
        paintPreview();
        if (p?.provider === 'youtube' && changed && !titleTouched) {
          const mine = ++seq;
          fetchTitle(p).then((t) => { if (t && mine === seq && !titleTouched && !f.title.value.trim()) f.title.value = t.slice(0, 140); });
        }
      }, 180);
      f.video_url.addEventListener('input', onLink);
      f.map_id.addEventListener('change', () => { st.site_id = null; fillSites(); });
      elSites.addEventListener('change', () => { st.site_id = elSites.value || null; });
      elOpQ.addEventListener('input', paintPicker);
      body.addEventListener('click', (ev) => {
        const b = ev.target.closest('button');
        if (!b || !body.contains(b) || b.dataset.act) return;
        if (b.dataset.side) { st.side = b.dataset.side; paintSides(); paintPicker(); }
        else if (b.dataset.op !== undefined) { st.operator_id = b.dataset.op || null; paintPicker(); }
        else if (b.dataset.cat) { st.category = b.dataset.cat; paintCats(); }
        else if (b.dataset.kind) { st.kind = b.dataset.kind; paintPreview(); }
      });
      f.addEventListener('submit', (ev) => { ev.preventDefault(); saveStrat(f, st, existing, entry); });
      fillSites(); paintSides(); paintPicker(); paintCats();
      if (f.video_url.value) paintPreview();
      if (!existing && matchMedia('(pointer: fine)').matches) setTimeout(() => f.video_url.focus(), 300);
    }
    async function saveStrat(f, st, existing, entry) {
      const p = parseVideoUrl(f.video_url.value);
      if (!p) return formErr(f, 'Lien non reconnu. Colle un lien YouTube, un Short ou un fichier .mp4.');
      const siteId = st.site_id || f.site_id.value;
      if (!siteId) return formErr(f, 'Choisis un BP (ou ajoute-en un à cette carte).');
      const start = parseTimeInput(f.start.value), end = parseTimeInput(f.end.value);
      if (f.start.value.trim() && start == null) return formErr(f, 'Début illisible. Écris par exemple 1:23.');
      if (f.end.value.trim() && end == null) return formErr(f, 'Fin illisible. Écris par exemple 1:40.');
      if (end != null && end <= (start || 0)) return formErr(f, 'La fin de boucle doit venir après le début.');
      const op = st.operator_id ? S.I.opById.get(st.operator_id) : null;
      const title = (f.title.value.trim() || `${op ? op.name : 'Stratégie'}, ${(CAT[st.category] || 'Trick').toLowerCase()}`).slice(0, 140);
      const row = {
        site_id: siteId, side: st.side, operator_id: op ? op.id : null, title, category: st.category,
        notes: f.notes.value.trim() || null, video_url: p.url, provider: p.provider, video_id: p.videoId,
        kind: st.kind || p.kind, start_seconds: start, end_seconds: end, pinned: f.pinned.checked,
      };
      formErr(f, ''); setBusy(f, true);
      const data = await write((c) => (existing ? c.from('strategies').update(row).eq('id', existing.id) : c.from('strategies').insert(row)).select().single());
      setBusy(f, false);
      if (!data) return;
      upsertLocal('strategies', data);
      Sheet.close(entry);
      toast(existing ? 'Vidéo enregistrée' : 'Vidéo ajoutée');
      const site = S.I.siteById.get(data.site_id);
      const m = site && S.I.mapById.get(site.map_id);
      if (P.isOpen && P.cur?.id === data.id) { P.cur = data; P.fill(data); }
      if (m && (S.route.site !== data.site_id || S.route.side !== data.side)) go({ map: m.slug, side: data.side, site: data.site_id });
      else render();
    }

      const s = S.I.stratById.get(id);

      try {
        if (navigator.share && matchMedia('(pointer: coarse)').matches) { await navigator.share({ title: s?.title || 'R6 Playbook', url }); return; }
        await navigator.clipboard.writeText(url);

    function uniqueSlug(name, taken) {

    }
    async function addOp(form, side) {
      const name = form.name.value.trim();
      if (!name) return;
      const slug = uniqueSlug(name, new Set(S.data.operators.map((o) => o.slug)));
      setBusy(form, true);
      const data = await write((c) => c.from('operators').insert({ name, slug, side }).select().single());
      setBusy(form, false);
      if (!data) return;
      upsertLocal('operators', data);
      Sheet.repaint();
      toast(`${name} ajouté`);
    }
    async function deleteOp(id, el) {
      const o = S.I.opById.get(id);
      const n = S.data.strategies.filter((s) => s.operator_id === id).length;
      if (!arm(el, n ? `Supprimer (${nfmt(n, 'vidéo passe', 'vidéos passent')} sans agent)` : 'Confirmer')) return;
      const data = await write((c) => c.from('operators').delete().eq('id', id).select('id'));
      if (!data || (Array.isArray(data) && !data.length)) { disarm(el); if (data) toast('Suppression refusée.', 'err'); return; }
      removeLocal('operators', id);
      Sheet.repaint(); render();
      toast(`${o?.name || 'Agent'} supprimé`);
    }
    function openPattern() {
      Sheet.open({
        title: 'Modèle d’URL des logos',
        body: `<p class="sheet-lede">Si tes logos sont déjà en ligne avec des noms réguliers, colle l’adresse d’un logo en remplaçant le nom de l’agent par <code>{slug}</code> (thermite, jager, solid-snake…) ou par <code>{name}</code>.</p>
          <form novalidate>
            <label class="fld"><span class="lbl">Modèle</span><input class="input" name="pattern" type="url" inputmode="url" placeholder="https://…/{slug}.png" autocomplete="off" autocapitalize="off" spellcheck="false" required></label>
            <div class="pv" data-pv aria-live="polite"></div>
            <p class="form-err" data-err hidden></p>
            <button class="btn btn-primary btn-block" type="submit">Appliquer aux ${S.data.operators.length} agents</button>
          </form>`,
        onMount: (b, entry) => {
          const f = b.querySelector('form');
          const pv = b.querySelector('[data-pv]');
          const build = (o) => f.pattern.value.trim().replaceAll('{slug}', o.slug).replaceAll('{name}', encodeURIComponent(o.name));
          f.pattern.addEventListener('input', debounce(() => {
            const ok = /\{(slug|name)\}/.test(f.pattern.value);
            pv.innerHTML = ok ? S.data.operators.slice(0, 6).map((o) => opAvatar({ ...o, icon_url: build(o) }, 40)).join('') : '';
          }, 250));
          f.addEventListener('submit', async (e) => {
            e.preventDefault();
            const p = f.pattern.value.trim();
            if (!/^https:\/\//.test(p) || !/\{(slug|name)\}/.test(p)) return formErr(f, 'Le modèle doit commencer par https:// et contenir {slug} ou {name}.');
            formErr(f, ''); setBusy(f, true);
            const rows = S.data.operators.map((o) => ({ id: o.id, slug: o.slug, name: o.name, side: o.side, icon_url: build(o) }));
            const data = await write((c) => c.from('operators').upsert(rows, { onConflict: 'id' }).select());
            setBusy(f, false);
            if (!data) return;
            mergeRows('operators', data);
            Sheet.close(entry); Sheet.repaint(); render();
            toast('Logos mis à jour');
          });
        },
      });
    }
    function mergeRows(table, rows) {
      for (const r of rows || []) {
        const i = S.data[table].findIndex((x) => x.id === r.id);
        if (i >= 0) S.data[table][i] = { ...S.data[table][i], ...r };
      }
      setData(S.data, true);
    }

    // —— Édition directe & images ——
    async function inlineEdit(el) {
      const [table, col] = el.dataset.edit.split('.');
      const id = el.dataset.id;
      const row = S.data[table]?.find((x) => x.id === id);
      if (!row) return;
      const value = el.type === 'checkbox' ? el.checked : el.value.trim();
      const revert = () => { if (el.type === 'checkbox') el.checked = row[col]; else el.value = row[col]; };
      if (value === '' || value === row[col]) { revert(); return; }
      const data = await write((c) => c.from(table).update({ [col]: value }).eq('id', id).select().single());
      if (!data) { revert(); return; }
      upsertLocal(table, data);
      render();
      toast('Modification enregistrée');
    }
    async function uploadOne(el) {
      const file = el.files?.[0];
      el.value = '';
      if (!file) return;
      const table = el.dataset.upload, id = el.dataset.id;
      const row = S.data[table]?.find((x) => x.id === id);
      if (!row) return;
      const col = table === 'maps' ? 'image_url' : 'icon_url';
      toast('Envoi de l’image…', 'info', 1800);
      try {
        const url = await uploadImage(file, table, row.slug);
        const data = await write((c) => c.from(table).update({ [col]: url }).eq('id', id).select().single());
        if (!data) return;
        upsertLocal(table, data);
        Sheet.repaint(); render();
        toast('Image mise à jour');
      } catch (e) { toast(dbError(e), 'err', 4200); }
    }
    function matchFiles(files, items) {
      const exact = new Map();
      for (const it of items) { exact.set(compact(it.slug), it); exact.set(compact(it.name), it); }
      return files.map((file) => {
        const base = compact(file.name.replace(/\.[^.]+$/, ''));
        let item = exact.get(base) || null;
        if (!item) {
          const cands = items.filter((x) => { const k = compact(x.slug); return k.length >= 3 && base.includes(k); });
          item = cands.sort((a, b) => compact(b.slug).length - compact(a.slug).length)[0] || null;
        }
        return { file, item };
      });
    }
    async function uploadBulk(el) {
      const files = Array.from(el.files || []);
      el.value = '';
      if (!files.length) return;
      const table = el.dataset.bulk;
      const items = S.data[table];
      const col = table === 'maps' ? 'image_url' : 'icon_url';
      const matches = matchFiles(files, items);
      const ok = matches.filter((m) => m.item);
      const miss = matches.filter((m) => !m.item);
      if (!ok.length) { toast(`Aucun fichier reconnu. Renomme-les comme ${table === 'maps' ? 'les cartes' : 'les agents'}.`, 'err', 4500); return; }
      toast(`Envoi de ${nfmt(ok.length, 'image', 'images')}…`, 'info', 2200);
      const queue = [...ok];
      const done = [];
      const worker = async () => {
        while (queue.length) {
          const m = queue.shift();
          try { done.push({ item: m.item, url: await uploadImage(m.file, table, m.item.slug) }); } catch (e) { console.warn('upload', m.file.name, e); }
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      if (done.length) {
        const rows = done.map(({ item, url }) => (table === 'maps'
          ? { id: item.id, slug: item.slug, name: item.name, [col]: url }
          : { id: item.id, slug: item.slug, name: item.name, side: item.side, [col]: url }));
        const data = await write((c) => c.from(table).upsert(rows, { onConflict: 'id' }).select());
        if (data) { mergeRows(table, data); Sheet.repaint(); render(); }
      }
      const failed = ok.length - done.length;
      const parts = [`${nfmt(done.length, 'image importée', 'images importées')}`];
      if (miss.length) parts.push(`${nfmt(miss.length, 'fichier non reconnu', 'fichiers non reconnus')}`);
      if (failed) parts.push(`${failed} en échec`);
      toast(parts.join(', '), miss.length || failed ? 'err' : 'ok', 4500);
    }

    // —— Configuration locale ——
    async function onSetupSubmit(e) {
      e.preventDefault();
      const f = e.target;
      const url = f.url.value.trim().replace(/\/+$/, '').replace(/\/rest\/v1$/, '');
      const key = f.key.value.trim();
      if (!/^(https:\/\/[^/\s]+|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?)$/.test(url)) return formErr(f, 'L’URL doit ressembler à https://xxxx.supabase.co');
      if (!key) return formErr(f, 'Colle la clé publishable du projet.');
      formErr(f, ''); setBusy(f, true);
      try {
        const res = await fetch(`${url}/rest/v1/maps?select=id&limit=1`, { headers: restHeaders(key) });
        if (res.status === 401 || res.status === 403) throw new Error('Clé refusée : copie la clé publishable (ou l’ancienne clé anon).');
        if (res.status === 404) throw new Error('Connexion réussie, mais les tables manquent : exécute supabase-setup.sql dans SQL Editor.');
        if (!res.ok) throw new Error(`Réponse inattendue de Supabase (${res.status}).`);
        LS.set(KEYS.config, { url, key });
        location.reload();
      } catch (err) {
        formErr(f, /fetch|network|load failed/i.test(err.message) ? 'Adresse injoignable. Vérifie l’URL du projet.' : err.message);
        setBusy(f, false);
      }
    }

    // ─────────────── 11. Évènements ───────────────
    const A = {
      back: () => goBack(),
      crumb: (el) => { const l = Number(el.dataset.level); go(l === 0 ? { map: null } : l === 1 ? { side: null } : { site: null }); },
      'pick-map': (el) => go({ map: el.dataset.slug }),
      'pick-side': (el) => go({ side: el.dataset.side }),
      'pick-site': (el) => go({ site: el.dataset.id }),
      recent: (el) => go({ map: el.dataset.map, side: el.dataset.side, site: el.dataset.site }),
      play: (el) => openStrategy(el.dataset.id),
      'f-op': (el) => { S.filter.op = el.dataset.id || null; render(); },
      'f-cat': (el) => { S.filter.cat = el.dataset.cat || null; render(); },
      'f-reset': () => { S.filter = { op: null, cat: null }; render(); },
      reload: () => { Sheet.closeAll(); refresh({ manual: true }); },
      account: () => openAccount(),
      logout: async () => { Sheet.closeAll(); try { const c = await sb(); await c.auth.signOut(); } catch { /* ignore */ } await applySession(null); toast('Déconnecté'); },
      'add-strat': () => { Sheet.closeAll(); openStratForm(); },
      'strat-menu': (el) => openStratMenu(el.dataset.id),
      'strat-edit': (el) => { const s = S.I.stratById.get(el.dataset.id); Sheet.closeAll(); if (s) openStratForm(s); },
      'strat-pin': (el) => togglePin(el.dataset.id),
      'strat-share': (el) => shareStrat(el.dataset.id),
      'strat-delete': (el) => deleteStrat(el.dataset.id, el),
      'manage-maps': () => { Sheet.closeAll(); openManageMaps(); },
      'manage-sites': () => { Sheet.closeAll(); openManageSites(); },
      'manage-ops': () => { Sheet.closeAll(); openManageOps(); },
      'map-delete': (el) => deleteMap(el.dataset.id, el),
      'site-delete': (el) => deleteSite(el.dataset.id, el),
      'op-delete': (el) => deleteOp(el.dataset.id, el),
      'ops-pattern': () => openPattern(),
      'sheet-close': () => Sheet.close(),
      'pl-close': () => closePlayer(),
      'pl-prev': () => stepPlayer(-1),
      'pl-next': () => stepPlayer(1),
      'pl-rate': (el) => P.setRate(Number(el.dataset.rate)),
      'pl-loop': () => P.toggleLoop(),
      'pl-sound': () => P.toggleSound(),
      'pl-unmute': () => P.toggleSound(),
      'config-reset': () => { LS.del(KEYS.config); location.reload(); },
    };
    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const fn = A[el.dataset.act];
      if (!fn) return;
      e.preventDefault();
      fn(el, e);
    });
    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el.matches('[data-edit]')) inlineEdit(el);
      else if (el.matches('input[type="file"][data-upload]')) uploadOne(el);
      else if (el.matches('input[type="file"][data-bulk]')) uploadBulk(el);
    });
    document.addEventListener('error', (e) => {
      const img = e.target;
      if (!(img instanceof HTMLImageElement)) return;
      if (img.dataset.fallback != null) { const s = document.createElement('span'); s.className = 'ini'; s.textContent = img.dataset.fallback; img.replaceWith(s); }
      else if (img.classList.contains('cover')) img.remove();
    }, true);
    document.addEventListener('keydown', (e) => {
      const t = e.target;
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable;
      if ((e.key === 'Enter' || e.key === ' ') && !typing && t.matches?.('[role="button"][data-act]') && e.target === document.activeElement) { e.preventDefault(); t.click(); return; }
      if (e.key === 'Escape') {
        if (Sheet.top) { e.preventDefault(); Sheet.close(); return; }
        if (S.route.video) { e.preventDefault(); closePlayer(); return; }
        if (!typing) goBack();
        return;
      }
      if (typing || e.metaKey || e.ctrlKey || e.altKey || Sheet.top || S.status !== 'ready') return;
      if (S.route.video) {
        const k = e.key.toLowerCase();
        if (e.key === 'ArrowRight') { e.preventDefault(); stepPlayer(1); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); stepPlayer(-1); }
        else if (k === 'l') P.toggleLoop();
        else if (k === 'm') P.toggleSound();
        else if (e.key === '1') P.setRate(0.25);
        else if (e.key === '2') P.setRate(0.5);
        else if (e.key === '3') P.setRate(1);
        else if (e.key === ' ') { e.preventDefault(); P.togglePlay(); }
        return;
      }
      if (e.key === 'Backspace') { e.preventDefault(); goBack(); return; }
      const d = depthOf(S.route);
      if (d === 1) { const k = e.key.toLowerCase(); if (k === 'a') go({ side: 'attack' }); else if (k === 'd') go({ side: 'defense' }); return; }
      if (/^[1-9]$/.test(e.key)) {
        const i = Number(e.key) - 1;
        if (d === 2) { const s = sitesOf(curMap())[i]; if (s) go({ site: s.id }); }
        else if (d === 3) { const s = filtered(stratsAt())[i]; if (s) openStrategy(s.id); }
        return;
      }
      if (d === 0 && e.key.length === 1 && /\S/.test(e.key)) $('#map-q')?.focus();
    });

    // gestes tactiles : glisser vers la droite = retour ; dans le lecteur, bas = fermer, gauche/droite = vidéo suivante/précédente
    let touch = null;
    document.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) { touch = null; return; }
      const t = e.touches[0];
      const tgt = e.target;
      if (tgt.closest('.hscroll, input, textarea, select, .layer, .stage, .pl-notes, .picker')) { touch = null; return; }
      touch = { x: t.clientX, y: t.clientY, at: Date.now(), player: Boolean(tgt.closest('.player')) };
      const card = tgt.closest('.card');
      if (card) P.warm();
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      if (!touch) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
      const s = touch;
      touch = null;
      if (Date.now() - s.at > 700) return;
      if (s.player) {
        if (dy > 90 && Math.abs(dx) < 80) closePlayer();
        else if (Math.abs(dx) > 70 && Math.abs(dy) < 50) stepPlayer(dx < 0 ? 1 : -1);
        return;
      }
      if (Sheet.top) return;
      if (dx > 80 && Math.abs(dy) < 60 && (isStandalone() || s.x > 24)) goBack();
    }, { passive: true });
    // survol (souris) : on prépare la vidéo avant le clic
    let hoverTimer = 0;
    document.addEventListener('pointerover', (e) => {
      if (e.pointerType !== 'mouse') return;
      const card = e.target.closest?.('.card');
      if (!card) return;
      clearTimeout(hoverTimer);
      hoverTimer = setTimeout(() => { const s = S.I?.stratById.get(card.dataset.id); if (s) P.prefetch(s); }, 140);
    });

    // ─────────────── 12. Démarrage ───────────────
    async function refresh({ manual = false } = {}) {
      if (!CFG.ok || S.refreshing) return;
      S.refreshing = true;
      try {
        const raw = await fetchData();
        const json = JSON.stringify(raw);
        const changed = json !== S.rawJson;
        const wasReady = S.status === 'ready';
        const wasStale = S.stale;
        S.rawJson = json; S.fetchedAt = Date.now(); S.stale = false; S.error = null;
        if (changed) setData(raw, true);
        S.status = 'ready';
        if (!wasReady || changed || wasStale) applyRoute({ force: true });
        if (manual) toast('Données à jour');
      } catch (e) {
        S.error = loadError(e);
        if (S.status === 'ready') S.stale = true; else S.status = 'error';
        render();
        if (manual) toast(S.error, 'err', 4500);
      } finally { S.refreshing = false; }
    }
    function paintStatic() {
      $('#bar-back').innerHTML = icon('chevron-left', 22);
      $('#bar-account').innerHTML = icon('person', 21);
      $('#pl-close').innerHTML = icon('chevron-down', 22);
      $$('[data-icon]').forEach((b) => { b.innerHTML = icon(b.dataset.icon, 21); });
    }
    function registerSW() {
      if (!('serviceWorker' in navigator)) return;
      const local = ['localhost', '127.0.0.1'].includes(location.hostname);
      if (location.protocol !== 'https:' && !local) return;
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
    function boot() {
      try { history.scrollRestoration = 'manual'; } catch { /* ignore */ }
      if (!history.state || !('from' in history.state)) history.replaceState({ from: null }, '', location.href);
      paintStatic();
      P.init();
      window.addEventListener('popstate', () => { if (Sheet.top) Sheet.closeAll(); applyRoute(); });
      if (!CFG.ok) { document.documentElement.classList.add('no-config'); S.status = 'setup'; render(); registerSW(); return; }
      const cache = LS.get(dataKey());
      if (cache?.data?.maps) { setData(cache.data); S.status = 'ready'; } else S.status = 'loading';
      applyRoute({ force: true });
      refresh();
      initAuth();
      registerSW();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - S.fetchedAt > 60000) refresh(); });
    }
    boot();
  </script>
</body>
